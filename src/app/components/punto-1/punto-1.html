<div class="container text-center">
    <h2>{{ eventos[indice].nombre}}</h2>
    <p>{{ eventos[indice].descripcion}}</p>
    <img [src]="eventos[indice].img" class="img-fluid oculto">
    <div class="mt-3 boton-container">
        <button class="btn btn-outline-primary" (click)="siguiente()">Siguiente</button>
        <button class="btn btn-outline-primary" (click)="anterior()">Anterior</button>
    </div>

</div>
